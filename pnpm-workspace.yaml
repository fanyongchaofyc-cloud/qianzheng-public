packages:
  - "apps/*"
  - "packages/*"
  - "scripts/*"

allowBuilds:
  '@nutui/nutui-react-taro': set this to true or false
  '@swc/core': set this to true or false
  '@tarojs/cli': set this to true or false

onlyBuiltDependencies:
  - "@nutui/nutui-react-taro"
  - "@tarojs/binding"
  - "@tarojs/cli"
  - "@swc/core"
  - "esbuild"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "@parcel/watcher"
  - "core-js"
  - "core-js-pure"
